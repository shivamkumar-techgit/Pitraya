<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid High-Contrast Golden Colors for Tab Favicon (No background circle, 100% transparent background) -->

  <!-- Outer Yantra Ring -->
  <circle cx="50" cy="50" r="44" stroke="#F5D061" stroke-width="2.5" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="39" stroke="#E6B325" stroke-width="3" />

  <!-- 8 Radial Golden Rays -->
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" transform="rotate(45 50 50)" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" transform="rotate(90 50 50)" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" transform="rotate(135 50 50)" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" transform="rotate(180 50 50)" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" transform="rotate(225 50 50)" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" transform="rotate(270 50 50)" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#F5D061" stroke-width="3" stroke-linecap="round" transform="rotate(315 50 50)" />

  <!-- Outer Lotus Petals (8 Petals) -->
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" />
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" transform="rotate(45 50 50)" />
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" transform="rotate(90 50 50)" />
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" transform="rotate(135 50 50)" />
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" transform="rotate(180 50 50)" />
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" transform="rotate(225 50 50)" />
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" transform="rotate(270 50 50)" />
  <path d="M 50 14 C 44 26, 44 36, 50 42 C 56 36, 56 26, 50 14 Z" fill="#E6B325" transform="rotate(315 50 50)" />

  <!-- Inner Lotus Petals (Bright Gold) -->
  <path d="M 50 20 C 35 34, 35 56, 50 64 C 65 56, 65 34, 50 20 Z" fill="#F5D061" />
  <path d="M 20 50 C 34 35, 56 35, 64 50 C 56 65, 34 65, 20 50 Z" fill="#F5D061" />

  <!-- Central Sacred Diya Base -->
  <path d="M 34 62 Q 50 75 66 62 Q 58 80 42 80 Q 34 80 34 62 Z" fill="#E6B325" />

  <!-- Central Flame of Eternal Peace (Bright Jyoti) -->
  <path d="M 50 28 C 43 42, 41 52, 50 59 C 59 52, 57 42, 50 28 Z" fill="#FFF2B2" />
  <!-- Inner Flame Core (Pure White) -->
  <path d="M 50 36 C 46 45, 45 50, 50 54 C 55 50, 54 45, 50 36 Z" fill="#FFFFFF" />

  <!-- Base Accent Dot -->
  <circle cx="50" cy="50" r="5" fill="#FFF2B2" />
</svg>
